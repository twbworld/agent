name: Release and Push Image to ACR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Go Tests and Build
    uses: twbworld/proxy/.github/workflows/test.yaml@main

  metadata:
    name: Extract Docker Metadata
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tags: ${{ steps.extract-metadata.outputs.tags }}
      image-labels: ${{ steps.extract-metadata.outputs.labels }}
      registry-url: ${{ steps.set-acr-vars.outputs.registry-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set ACR Registry and Image Name Variables
        id: set-acr-vars
        run: |
          REGISTRY_URL="${{ vars.ACR_REGISTRY }}"
          ACR_IMAGE_NAME_VAR="${{ vars.ACR_IMAGE_NAME }}"
          if [ -z "$ACR_IMAGE_NAME_VAR" ]; then
            IMAGE_NAME_FINAL="${{ github.repository_owner }}/${{ github.event.repository.name }}"
          else
            IMAGE_NAME_FINAL="$ACR_IMAGE_NAME_VAR"
          fi
          echo "registry-url=$REGISTRY_URL" >> $GITHUB_OUTPUT
          echo "image-name=$IMAGE_NAME_FINAL" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: extract-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.set-acr-vars.outputs.registry-url != '' && format('{0}/{1}', steps.set-acr-vars.outputs.registry-url, steps.set-acr-vars.outputs.image-name) || '' }}
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/{1}', vars.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

  push-images:
    needs: [test, metadata]
    if: needs.metadata.outputs.image-tags
    uses: twbworld/proxy/.github/workflows/push-images.yaml@main
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit
    with:
      image-tags: ${{ needs.metadata.outputs.image-tags }}
      image-labels: ${{ needs.metadata.outputs.image-labels }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      registry-url: ${{ needs.metadata.outputs.registry-url }}
